<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
<title>모니터링 대시보드</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #14171f;
    --text-2: #4b5563;
    --muted: #8a90a0;
    --line: #e6e8ee;
    --brand: #2f6fed;
    --brand-soft: #eaf0ff;
    --ok: #0e9f6e;
    --ok-soft: #e6f7f0;
    --wait: #b45309;
    --wait-soft: #fdf3e3;
    --idle: #64748b;
    --idle-soft: #eef1f6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #161b24;
      --text: #e8eaf0;
      --text-2: #b3bac9;
      --muted: #838c9e;
      --line: #262d3a;
      --brand: #6f9bff;
      --brand-soft: #1b2740;
      --ok: #34d399;
      --ok-soft: #102a22;
      --wait: #f0b26b;
      --wait-soft: #2b2115;
      --idle: #96a0b5;
      --idle-soft: #1d2430;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 44px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* header */
  header {
    padding: 26px 0 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .sub {
    margin: 5px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .sub b { color: var(--text-2); font-weight: 600; }
  .refresh {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-2);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, color .12s ease;
  }
  .refresh:hover { border-color: var(--brand); color: var(--brand); }
  .refresh:active { transform: scale(.97); }
  .refresh .ico { display: inline-block; transition: transform .6s ease; }
  .refresh.loading .ico { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 4px 0 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .stat .k {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--muted);
  }
  .stat .v {
    display: block;
    margin-top: 3px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat.hit .v { color: var(--ok); }

  .headline {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 0 0 20px;
    padding: 13px 15px;
    border-radius: 13px;
    background: var(--brand-soft);
    color: var(--text-2);
    font-size: 13.5px;
    line-height: 1.45;
    font-weight: 500;
  }
  .headline .dot {
    flex: none;
    width: 7px; height: 7px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--brand);
  }

  /* cards */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--brand);
    opacity: .85;
  }
  .card[data-status="hit"]::before { background: var(--ok); }
  .card[data-status="waiting"]::before { background: var(--wait); }
  .card[data-status="idle"]::before { background: var(--idle); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .name { min-width: 0; }
  .title {
    margin: 0;
    font-size: 15.5px;
    font-weight: 750;
    letter-spacing: -.01em;
    line-height: 1.3;
    word-break: keep-all;
  }
  .icon { margin-right: 2px; }
  .subtitle {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    word-break: keep-all;
  }
  .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    white-space: nowrap;
    background: var(--brand-soft);
    color: var(--brand);
  }
  .badge::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .card[data-status="hit"] .badge { background: var(--ok-soft); color: var(--ok); }
  .card[data-status="waiting"] .badge { background: var(--wait-soft); color: var(--wait); }
  .card[data-status="idle"] .badge { background: var(--idle-soft); color: var(--idle); }

  .field {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .field.first { margin-top: 13px; border-top: 0; padding-top: 0; }
  .k {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .03em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .condition {
    margin: 4px 0 0;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    word-break: keep-all;
  }
  .value {
    margin: 4px 0 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    word-break: keep-all;
  }
  .card[data-status="hit"] .value { color: var(--ok); }
  .value-label {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--text-2);
    word-break: keep-all;
  }
  .gap {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 8px;
    border-radius: 7px;
    background: var(--idle-soft);
    color: var(--text-2);
    font-size: 11.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .note {
    margin: 10px 0 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-2);
    word-break: keep-all;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: auto;
    padding-top: 12px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .card-foot .src {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-foot time { flex: none; font-variant-numeric: tabular-nums; }

  /* states */
  .notice {
    padding: 28px 18px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .notice strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 14.5px; }
  .notice code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: var(--idle-soft);
    padding: 2px 6px;
    border-radius: 5px;
  }
  footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--muted);
  }
  footer code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }
  .skeleton { min-height: 190px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>모니터링 대시보드</h1>
      <p class="sub">데이터 갱신 <b id="updated">확인 중…</b></p>
    </div>
    <button class="refresh" id="refresh" type="button" aria-label="새로고침">
      <span class="ico" aria-hidden="true">↻</span><span>새로고침</span>
    </button>
  </header>

  <section class="stats" id="stats" aria-label="요약">
    <div class="stat"><span class="k">감시 항목</span><span class="v" id="s-total">–</span></div>
    <div class="stat hit"><span class="k">조건 충족</span><span class="v" id="s-hit">–</span></div>
    <div class="stat"><span class="k">감시 중</span><span class="v" id="s-live">–</span></div>
  </section>

  <p class="headline" id="headline" hidden><span class="dot" aria-hidden="true"></span><span id="headline-text"></span></p>

  <section class="grid" id="grid" aria-live="polite">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </section>

  <footer>
    <div id="foot-updated">데이터 파일 <code>data.json</code> 기준 · 표시 시간 한국 표준시(KST)</div>
    <div>조건에 맞는 항목이 확인되면 별도 알림으로 정리됩니다. 이 화면은 상태 확인용입니다.</div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var DATA_URL = "data.json";
  var REFRESH_MS = 5 * 60 * 1000;
  var grid = document.getElementById("grid");
  var errBox = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // KST 기준 "YYYY.MM.DD HH:mm"
  function kstText(iso, withDate) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "–";
    var p = {};
    new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d).forEach(function (part) { p[part.type] = part.value; });
    var hm = pad(parseInt(p.hour, 10) % 24) + ":" + p.minute;
    return withDate === false ? hm : p.year + "." + p.month + "." + p.day + " " + hm;
  }

  function ago(iso) {
    if (!iso) return "";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var min = Math.round((Date.now() - t) / 60000);
    if (min < 1) return "방금";
    if (min < 60) return min + "분 전";
    if (min < 1440) return Math.floor(min / 60) + "시간 전";
    return Math.floor(min / 1440) + "일 전";
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function statusOf(item) {
    var s = item.status || "watching";
    return ["hit", "watching", "waiting", "idle"].indexOf(s) >= 0 ? s : "watching";
  }

  function cardHTML(item) {
    var st = statusOf(item);
    var html = '<article class="card" data-status="' + st + '">';
    html += '<div class="card-top"><div class="name">';
    html += '<h2 class="title">' + (item.icon ? '<span class="icon" aria-hidden="true">' + esc(item.icon) + "</span>" : "") + esc(item.title) + "</h2>";
    if (item.subtitle) html += '<p class="subtitle">' + esc(item.subtitle) + "</p>";
    html += "</div><span class=\"badge\">" + esc(item.status_label || "감시 중") + "</span></div>";

    html += '<div class="field first"><span class="k">목표 조건</span><p class="condition">' + esc(item.condition || "–") + "</p></div>";

    html += '<div class="field"><span class="k">최근 확인</span>';
    html += '<p class="value">' + esc(item.latest_value || "–") + "</p>";
    if (item.latest_label) html += '<p class="value-label">' + esc(item.latest_label) + "</p>";
    if (item.gap) html += '<span class="gap">' + esc(item.gap) + "</span>";
    html += "</div>";

    if (item.note) html += '<p class="note">' + esc(item.note) + "</p>";

    html += '<div class="card-foot"><span class="src">' + esc(item.source || "") + "</span>";
    html += '<time datetime="' + esc(item.observed_at || "") + '" title="' + esc(kstText(item.observed_at)) + '">' +
      esc(kstText(item.observed_at, false)) + "</time></div>";
    html += "</article>";
    return html;
  }

  function render(data) {
    var items = (data && data.items) || [];
    var hit = items.filter(function (i) { return statusOf(i) === "hit"; }).length;
    var waiting = items.filter(function (i) { return statusOf(i) === "waiting"; }).length;
    var live = items.length - hit;

    document.getElementById("s-total").textContent = items.length;
    document.getElementById("s-hit").textContent = hit;
    document.getElementById("s-live").textContent = live;

    var updatedText = kstText(data.updated_at);
    document.getElementById("updated").textContent = updatedText + " KST" + (ago(data.updated_at) ? " (" + ago(data.updated_at) + ")" : "");
    document.getElementById("foot-updated").innerHTML =
      '데이터 파일 <code>data.json</code> 기준 · 갱신 ' + esc(updatedText) + " KST · 표시 시간 한국 표준시(KST)";

    var hl = document.getElementById("headline");
    var txt = data.headline || (hit > 0
      ? "조건을 충족한 항목이 " + hit + "건 있습니다."
      : "감시 " + items.length + "건 모두 가동 중 · 조건 충족 알림 없음" + (waiting ? " (발표 대기 " + waiting + "건)" : ""));
    document.getElementById("headline-text").textContent = txt;
    hl.hidden = false;

    if (!items.length) {
      grid.innerHTML = '<div class="notice"><strong>감시 항목이 없습니다</strong>data.json 의 items 배열을 확인하세요.</div>';
      return;
    }
    grid.innerHTML = items.map(cardHTML).join("");
  }

  function showError(msg) {
    var box = document.getElementById("load-error");
    if (!box) {
      box = document.createElement("div");
      box.id = "load-error";
      box.className = "notice";
      box.style.marginTop = "14px";
      grid.parentNode.insertBefore(box, grid.nextSibling);
    }
    box.innerHTML = "<strong>데이터를 불러오지 못했습니다</strong>" + esc(msg) +
      "<br>잠시 후 <b>새로고침</b>을 눌러 주세요.";
  }

  function clearError() {
    var box = document.getElementById("load-error");
    if (box) box.remove();
  }

  var btn = document.getElementById("refresh");
  var busy = false;

  function load(manual) {
    if (busy) return;
    busy = true;
    btn.classList.add("loading");
    var url = DATA_URL + "?t=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        clearError();
        render(data);
      })
      .catch(function (e) {
        if (manual) showError(e && e.message ? e.message : "알 수 없는 오류");
        else if (!document.querySelector(".card")) showError(e && e.message ? e.message : "알 수 없는 오류");
      })
      .then(function () {
        busy = false;
        btn.classList.remove("loading");
      });
  }

  btn.addEventListener("click", function () { load(true); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") load(false);
  });
  setInterval(function () { if (document.visibilityState === "visible") load(false); }, REFRESH_MS);
  load(false);
})();
</script>
</body>
</html>
