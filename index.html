<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
<title>모니터링 대시보드</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #14171f;
    --text-2: #4b5563;
    --muted: #8a90a0;
    --line: #e6e8ee;
    --brand: #2f6fed;
    --brand-soft: #eaf0ff;
    --ok: #0e9f6e;
    --ok-soft: #e6f7f0;
    --wait: #b45309;
    --wait-soft: #fdf3e3;
    --idle: #64748b;
    --idle-soft: #eef1f6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 18px rgba(16, 24, 40, .05);
    --shadow-lg: 0 12px 40px rgba(16, 24, 40, .18);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #161b24;
      --text: #e8eaf0;
      --text-2: #b3bac9;
      --muted: #838c9e;
      --line: #262d3a;
      --brand: #6f9bff;
      --brand-soft: #1b2740;
      --ok: #34d399;
      --ok-soft: #102a22;
      --wait: #f0b26b;
      --wait-soft: #2b2115;
      --idle: #96a0b5;
      --idle-soft: #1d2430;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .32);
      --shadow-lg: 0 14px 44px rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;               /* 6카드가 항상 한 화면에 들어오도록 문서 스크롤 제거 */
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    height: 100dvh;
    max-height: 100dvh;
    max-width: 1120px;
    margin: 0 auto;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  /* ── 상단 슬림 바 ───────────────────────── */
  .bar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 8px;
  }
  h1 {
    grid-column: 1;
    grid-row: 1;
    margin: 0;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -.02em;
    white-space: nowrap;
  }
  h1 .mark { color: var(--brand); }
  .refresh {
    grid-column: 2;
    grid-row: 1;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-2);
    font: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .refresh:hover { border-color: var(--brand); color: var(--brand); }
  .refresh:active { transform: scale(.97); }
  .refresh .ico { display: inline-block; font-size: 13px; line-height: 1; transition: transform .6s ease; }
  .refresh.loading .ico { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    font-size: 11.5px;
    color: var(--muted);
  }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip b { font-size: 12px; font-weight: 800; color: var(--text); }
  .chip.hit { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .chip.hit b { color: var(--ok); }
  .chip.wait { background: var(--wait-soft); border-color: transparent; color: var(--wait); }
  .chip.wait b { color: var(--wait); }
  .stamp { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .headline {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0 2px;
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--text-2);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .headline .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
  .headline span:last-child { overflow: hidden; text-overflow: ellipsis; }

  /* ── 카드 그리드 (한 화면 6개) ─────────────── */
  .grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  @media (min-width: 760px) {
    .grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .wrap { gap: 10px; padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
    .bar { grid-template-columns: auto 1fr auto; gap: 10px; }
    h1 { grid-column: 1; grid-row: 1; font-size: 15px; }
    .refresh { grid-column: 3; grid-row: 1; height: 32px; padding: 0 13px; font-size: 12px; }
    .meta { grid-column: 2; grid-row: 1; justify-content: flex-end; }
    .headline { font-size: 12px; }
  }
  @media (min-width: 760px) and (min-height: 1080px) {
    .grid { max-height: 780px; }
  }

  .card {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 10px 8px 13px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .14s ease, transform .14s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--brand);
    opacity: .9;
  }
  .card[data-status="hit"]::before { background: var(--ok); }
  .card[data-status="waiting"]::before { background: var(--wait); }
  .card[data-status="idle"]::before { background: var(--idle); }
  @media (hover: hover) { .card:hover { border-color: var(--brand); } .card:hover .more-hint { color: var(--brand); } }
  .card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .card:active { transform: scale(.994); }

  .card-top { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 5px; }
  .title {
    margin: 0;
    min-width: 0;
    font-size: clamp(12.5px, 1.1vh + 7px, 15px);
    font-weight: 750;
    letter-spacing: -.01em;
    line-height: 1.28;
    word-break: keep-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .icon { margin-right: 1px; font-size: .95em; }
  .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: clamp(9.5px, .8vh + 3px, 11px);
    font-weight: 800;
    line-height: 1.35;
    white-space: nowrap;
    background: var(--brand-soft);
    color: var(--brand);
  }
  .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .card[data-status="hit"] .badge { background: var(--ok-soft); color: var(--ok); }
  .card[data-status="waiting"] .badge { background: var(--wait-soft); color: var(--wait); }
  .card[data-status="idle"] .badge { background: var(--idle-soft); color: var(--idle); }

  .card-mid { flex: none; min-width: 0; }
  .value {
    margin: 0;
    font-size: clamp(15px, 1.9vh + 6px, 24px);
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1.2;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    word-break: keep-all;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card[data-status="hit"] .value { color: var(--ok); }
  .label {
    margin: 2px 0 0;
    font-size: clamp(10.5px, .75vh + 6px, 12.5px);
    line-height: 1.35;
    color: var(--text-2);
    word-break: keep-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .gap {
    display: inline-block;
    margin-top: 4px;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--idle-soft);
    color: var(--text-2);
    font-size: 10.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-foot {
    flex: none;
    margin-top: auto;
    padding-top: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--muted);
    min-width: 0;
  }
  .card-foot .cond { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-foot time { flex: none; font-variant-numeric: tabular-nums; }
  .more-hint { flex: none; font-size: 12px; line-height: 1; color: var(--muted); }

  /* ── 상태 / 스켈레톤 ─────────────────────── */
  .notice {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: auto;
  }
  .notice strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 14px; }
  .notice code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .skeleton {
    min-height: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }

  /* ── 상세 시트/모달 ──────────────────────── */
  dialog.sheet {
    position: fixed;
    inset: auto 0 0 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    width: 100%;
    max-width: 100%;
    max-height: 100%;
    color: var(--text);
  }
  dialog.sheet::backdrop { background: rgba(8, 12, 20, .48); }
  .sheet-box {
    position: relative;
    max-height: 88dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--card);
    border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-lg);
    animation: sheetIn .18s ease-out;
  }
  @keyframes sheetIn { from { transform: translateY(18px); opacity: .6 } to { transform: none; opacity: 1 } }
  .sheet-grab { width: 36px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: flex-start; gap: 8px; }
  .sheet-head h2 {
    margin: 0;
    flex: 1 1 auto;
    min-width: 0;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.3;
    word-break: keep-all;
  }
  .sheet-close {
    flex: none;
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--card);
    color: var(--text-2);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .sheet-close:hover { border-color: var(--brand); color: var(--brand); }
  .sheet-sub { margin: 4px 0 0; font-size: 12px; color: var(--muted); word-break: keep-all; }
  .sheet-badge-row { margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sheet-badge-row .badge { font-size: 11.5px; padding: 3px 9px; }
  .sheet-badge-row[data-status="hit"] .badge { background: var(--ok-soft); color: var(--ok); }
  .sheet-badge-row[data-status="waiting"] .badge { background: var(--wait-soft); color: var(--wait); }
  .sheet-badge-row[data-status="idle"] .badge { background: var(--idle-soft); color: var(--idle); }
  .updated-note { font-size: 11px; color: var(--muted); }
  .rows { margin: 12px 0 0; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row dt { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .02em; color: var(--muted); padding-top: 2px; }
  .row dd { margin: 0; font-size: 13px; line-height: 1.45; color: var(--text); word-break: keep-all; overflow-wrap: anywhere; }
  .row dd.big { font-size: 19px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .row dd .small { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .row dd a { color: var(--brand); font-weight: 600; text-decoration: none; word-break: break-all; }
  .row dd a:hover { text-decoration: underline; }
  .sheet-foot { margin-top: 12px; font-size: 11px; line-height: 1.6; color: var(--muted); }
  .sheet-foot code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }

  @media (min-width: 640px) {
    dialog.sheet { inset: 0; margin: auto; max-width: 460px; max-height: 84dvh; }
    .sheet-box { border-radius: 18px; max-height: 84dvh; padding: 18px 20px 18px; }
    .sheet-grab { display: none; }
    .row { grid-template-columns: 88px 1fr; }
  }

  /* 아주 낮은 화면(가로 모드 등): 장식 최소화 */
  @media (max-height: 480px) {
    .headline { display: none; }
    .card { gap: 3px; padding: 7px 8px 6px 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1><span class="mark" aria-hidden="true">◉</span> 모니터링</h1>
    <button class="refresh" id="refresh" type="button" aria-label="새로고침">
      <span class="ico" aria-hidden="true">↻</span><span>새로고침</span>
    </button>
    <div class="meta">
      <span class="chip"><b id="s-total">–</b>감시</span>
      <span class="chip hit"><b id="s-hit">–</b>충족</span>
      <span class="chip wait"><b id="s-wait">–</b>대기</span>
      <span class="stamp" id="updated">확인 중…</span>
    </div>
  </header>

  <p class="headline" id="headline" hidden><span class="dot" aria-hidden="true"></span><span id="headline-text"></span></p>

  <section class="grid" id="grid" aria-live="polite" aria-label="감시 항목">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </section>
</div>

<dialog class="sheet" id="detail" aria-labelledby="d-title">
  <div class="sheet-box">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="d-title">–</h2>
      <button class="sheet-close" type="button" id="d-close" aria-label="닫기">✕</button>
    </div>
    <p class="sheet-sub" id="d-sub"></p>
    <div class="sheet-badge-row">
      <span class="badge" id="d-badge">–</span>
      <span class="updated-note" id="d-observed"></span>
    </div>
    <dl class="rows" id="d-rows"></dl>
    <p class="sheet-foot">데이터 파일 <code>data.json</code> 기준 · 표시 시간 한국 표준시(KST)<br>
      조건에 맞는 항목이 확인되면 별도 알림으로 정리됩니다. 이 화면은 상태 확인용입니다.</p>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var DATA_URL = "data.json";
  var REFRESH_MS = 5 * 60 * 1000;
  var grid = document.getElementById("grid");
  var items = [];
  var dialog = document.getElementById("detail");
  var returnFocus = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // KST 기준 "YYYY.MM.DD HH:mm"
  function kstText(iso, withDate) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "–";
    var p = {};
    new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d).forEach(function (part) { p[part.type] = part.value; });
    var hm = pad(parseInt(p.hour, 10) % 24) + ":" + p.minute;
    return withDate === false ? hm : p.year + "." + p.month + "." + p.day + " " + hm;
  }

  function ago(iso) {
    if (!iso) return "";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var min = Math.round((Date.now() - t) / 60000);
    if (min < 1) return "방금";
    if (min < 60) return min + "분 전";
    if (min < 1440) return Math.floor(min / 60) + "시간 전";
    return Math.floor(min / 1440) + "일 전";
  }

  // XSS 방지: 모든 데이터는 이 함수를 거쳐 텍스트로만 삽입
  function escapeHTML(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function statusOf(item) {
    var s = item.status || "watching";
    return ["hit", "watching", "waiting", "idle"].indexOf(s) >= 0 ? s : "watching";
  }

  function safeURL(u) {
    var s = String(u || "").trim();
    return /^https?:\/\//i.test(s) ? s : "";
  }

  function cardHTML(item, idx) {
    var st = statusOf(item);
    var html = '<article class="card" role="button" tabindex="0" aria-haspopup="dialog" data-status="' + st + '" data-idx="' + idx + '" aria-label="' +
      escapeHTML((item.title || "감시 항목") + " 상세 보기") + '">';
    html += '<div class="card-top"><h2 class="title">' +
      (item.icon ? '<span class="icon" aria-hidden="true">' + escapeHTML(item.icon) + "</span>" : "") +
      escapeHTML(item.title) + "</h2>";
    html += '<span class="badge">' + escapeHTML(item.status_label || "감시 중") + "</span></div>";

    html += '<div class="card-mid"><p class="value">' + escapeHTML(item.latest_value || "–") + "</p>";
    if (item.latest_label) html += '<p class="label">' + escapeHTML(item.latest_label) + "</p>";
    if (item.gap) html += '<span class="gap">' + escapeHTML(item.gap) + "</span>";
    html += "</div>";

    html += '<div class="card-foot">';
    html += '<span class="cond">' + escapeHTML(item.condition || "") + "</span>";
    html += '<time datetime="' + escapeHTML(item.observed_at || "") + '" title="마지막 확인 ' + escapeHTML(kstText(item.observed_at)) + ' KST">' +
      escapeHTML(kstText(item.observed_at, false)) + "</time>";
    html += '<span class="more-hint" aria-hidden="true">›</span></div>';
    html += "</article>";
    return html;
  }

  function render(data) {
    items = (data && data.items) || [];
    var hit = items.filter(function (i) { return statusOf(i) === "hit"; }).length;
    var waiting = items.filter(function (i) { return statusOf(i) === "waiting"; }).length;

    document.getElementById("s-total").textContent = items.length;
    document.getElementById("s-hit").textContent = hit;
    document.getElementById("s-wait").textContent = waiting;

    var updatedText = kstText(data.updated_at);
    document.getElementById("updated").textContent = updatedText + " 갱신" + (ago(data.updated_at) ? " · " + ago(data.updated_at) : "");

    var hl = document.getElementById("headline");
    var txt = data.headline || (hit > 0
      ? "조건을 충족한 항목이 " + hit + "건 있습니다."
      : "감시 " + items.length + "건 모두 가동 중 · 조건 충족 알림 없음" + (waiting ? " (발표 대기 " + waiting + "건)" : ""));
    document.getElementById("headline-text").textContent = txt;
    hl.title = txt;
    hl.hidden = false;

    if (!items.length) {
      grid.innerHTML = '<div class="notice"><strong>감시 항목이 없습니다</strong>data.json 의 items 배열을 확인하세요.</div>';
      return;
    }
    grid.innerHTML = items.map(cardHTML).join("");
  }

  /* ── 상세 시트 ───────────────────────────── */
  function openDetail(idx) {
    var item = items[idx];
    if (!item) return;
    var st = statusOf(item);
    var badge = document.getElementById("d-badge");
    badge.textContent = item.status_label || "감시 중";
    document.getElementById("d-title").textContent =
      (item.icon ? item.icon + " " : "") + (item.title || "감시 항목");
    var sub = document.getElementById("d-sub");
    sub.textContent = item.subtitle || "";
    sub.hidden = !item.subtitle;
    document.getElementById("d-observed").textContent =
      "마지막 확인 " + kstText(item.observed_at) + (ago(item.observed_at) ? " · " + ago(item.observed_at) : "");

    var rows = "";
    rows += '<div class="row"><dt>목표 조건</dt><dd>' + escapeHTML(item.condition || "–") + "</dd></div>";
    rows += '<div class="row"><dt>최근 확인</dt><dd class="big">' + escapeHTML(item.latest_value || "–") +
      (item.latest_label ? '<span class="small">' + escapeHTML(item.latest_label) + "</span>" : "") + "</dd></div>";
    if (item.gap) rows += '<div class="row"><dt>목표 격차</dt><dd>' + escapeHTML(item.gap) + "</dd></div>";
    if (item.note) rows += '<div class="row"><dt>메모</dt><dd>' + escapeHTML(item.note) + "</dd></div>";
    var url = safeURL(item.link || item.url);
    var src = escapeHTML(item.source || "–");
    rows += '<div class="row"><dt>출처</dt><dd>' + (url
      ? '<a href="' + escapeHTML(url) + '" target="_blank" rel="noopener noreferrer nofollow">' + src + " ↗</a>"
      : src) + "</dd></div>";
    rows += '<div class="row"><dt>확인 시각</dt><dd>' + escapeHTML(kstText(item.observed_at)) + " KST</dd></div>";
    document.getElementById("d-rows").innerHTML = rows;

    badge.parentNode.setAttribute("data-status", st);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", "");
  }

  function closeDetail() {
    if (typeof dialog.close === "function") dialog.close();
    else dialog.removeAttribute("open");
    if (returnFocus && returnFocus.focus) returnFocus.focus();
  }

  grid.addEventListener("click", function (e) {
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    returnFocus = card;
    openDetail(parseInt(card.getAttribute("data-idx"), 10));
  });
  grid.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    e.preventDefault();
    returnFocus = card;
    openDetail(parseInt(card.getAttribute("data-idx"), 10));
  });
  document.getElementById("d-close").addEventListener("click", closeDetail);
  dialog.addEventListener("click", function (e) {
    if (e.target === dialog) closeDetail();   // 바깥(백드롭) 탭으로 닫기
  });
  dialog.addEventListener("close", function () {
    if (returnFocus && returnFocus.focus) returnFocus.focus();
  });

  /* ── 데이터 로드 ─────────────────────────── */
  function showError(msg) {
    var box = document.getElementById("load-error");
    if (!box) {
      box = document.createElement("div");
      box.id = "load-error";
      box.className = "notice";
      box.style.position = "fixed";
      box.style.left = "50%";
      box.style.bottom = "16px";
      box.style.transform = "translateX(-50%)";
      box.style.width = "min(92vw, 420px)";
      box.style.boxShadow = "var(--shadow-lg)";
      document.body.appendChild(box);
    }
    box.innerHTML = "<strong>데이터를 불러오지 못했습니다</strong>" + escapeHTML(msg) +
      "<br>잠시 후 <b>새로고침</b>을 눌러 주세요.";
  }

  function clearError() {
    var box = document.getElementById("load-error");
    if (box) box.remove();
  }

  var btn = document.getElementById("refresh");
  var busy = false;

  function load(manual) {
    if (busy) return;
    busy = true;
    btn.classList.add("loading");
    var url = DATA_URL + "?t=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        clearError();
        render(data);
      })
      .catch(function (e) {
        if (manual || !document.querySelector(".card")) showError(e && e.message ? e.message : "알 수 없는 오류");
      })
      .then(function () {
        busy = false;
        btn.classList.remove("loading");
      });
  }

  btn.addEventListener("click", function () { load(true); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") load(false);
  });
  setInterval(function () { if (document.visibilityState === "visible") load(false); }, REFRESH_MS);
  load(false);
})();
</script>
</body>
</html>
